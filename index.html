<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05060A">
<title>Umbra</title>
<meta name="description" content="Umbra discovers every AI tool and agent in an enterprise, stops data leaks with deterministic policy, and turns shadow AI into an AI transformation roadmap.">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="app">
  <aside class="rail" id="rail" aria-label="Umbra navigation">
    <div class="brand"><span id="mark"></span><div><b>UMBRA</b><small>AI GOVERNANCE</small></div></div>
    <div class="sep">See</div>
    <button class="nav on" data-v="totality"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="9" stroke-dasharray="2 3"/></svg>Totality</button>
    <button class="nav" data-v="constellation"><svg viewBox="0 0 24 24"><circle cx="5" cy="7" r="1.6"/><circle cx="18" cy="5" r="1.6"/><circle cx="12" cy="13" r="2"/><circle cx="19" cy="18" r="1.6"/><circle cx="6" cy="19" r="1.6"/><path d="M5 7l7 6 6-8M12 13l7 5M12 13l-6 6"/></svg>Constellation<span class="n" id="n-svc"></span></button>
    <button class="nav" data-v="agents"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"/></svg>Agents<span class="n hot" id="n-ag"></span></button>
    <div class="sep">Govern</div>
    <button class="nav" data-v="inspect"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Inspect</button>
    <button class="nav" data-v="policies"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>Policies</button>
    <button class="nav" data-v="incidents"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>Incidents<span class="n hot" id="n-inc"></span></button>
    <div class="sep">Transform</div>
    <button class="nav" data-v="demand"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Demand Map</button>
    <button class="nav" data-v="assurance"><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="3"/></svg>Assurance</button>
    <button class="nav" data-v="coach"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>Employee view</button>
    <div class="foot">Demo tenant: <b>Kestrel Mutual</b>, a fictional insurer. All data is synthetic.<br><a href="case-study.html">Read the case study</a> · <a href="https://github.com/murtuzabuilds/umbra">Code</a><br>Designed and built by Murtuza.</div>
  </aside>
  <main class="main" id="main">
    <header class="top">
      <button class="btn sm menu-btn" id="menu" aria-label="Menu">☰</button>
      <h1 id="title">Totality</h1><span class="sp"></span>
      <span class="pill hide-sm" id="pill-org">Kestrel Mutual · 2,400 people · last 30 days</span>
      <span class="pill"><i></i>Live demo</span>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
